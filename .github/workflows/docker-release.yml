name: Docker Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（可含 v 前缀，留空则取仓库最新 tag）'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取版本号
        id: version
        run: |
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="${INPUT#v}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::无法确定版本号（手动触发请输入 version，或仓库无任何 tag）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "git_tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "已确定版本号: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: maven

      - name: Maven 构建
        run: mvn -B -ntp clean package -Drevision=${{ steps.version.outputs.version }} -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建 & 推送多架构镜像
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/html2pdf-web:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/html2pdf-web:latest
            ghcr.io/${{ github.repository_owner }}/html2pdf-web:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/html2pdf-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 生成 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.git_tag }}
          tag_name: ${{ steps.version.outputs.git_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
